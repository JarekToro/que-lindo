[workspace]
resolver = "2"
members = ["crates/slideshow-core", "crates/slideshow-cli", "app/src-tauri"]

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/JarekToro/que-lindo"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vello_cpu = { version = "0.2", features = ["multithreading"] }
cosmic-text = { version = "0.19", features = ["peniko"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
kamadak-exif = "0.6"

[profile.release]
lto = "thin"

# Preview/render speed matters even in dev builds
[profile.dev.package."*"]
opt-level = 2
